name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android command line tools, so the
      # build uses them directly instead of depending on a third-party setup
      # action. Every value is echoed, so a failure here names the cause.
      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            for candidate in /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then SDK_ROOT="$candidate"; break; fi
            done
          fi
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::no Android SDK found on this runner"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "SDK root: $SDK_ROOT"
          ls "$SDK_ROOT"

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          sdkmanager --list_installed

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          DECLARED_VERSION="$(grep '^APP_VERSION_NAME=' gradle.properties | tail -n 1 | cut -d= -f2)"
          if [ "$DECLARED_VERSION" != "$VERSION_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match APP_VERSION_NAME=$DECLARED_VERSION"
            exit 1
          fi

      - name: Test
        run: ./gradlew test --no-daemon --console=plain

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Prepare artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/SD302-${VERSION}-debug.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sd302-apk
          path: release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          # Let GitHub list every commit between the previous tag and this one.
          # A hand-written or commit-derived body goes stale: it either repeats
          # the same notes for every release, or describes the last commit to
          # land rather than the release itself.
          generate_release_notes: true
