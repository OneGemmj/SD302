name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          DECLARED_VERSION="$(grep '^APP_VERSION_NAME=' gradle.properties | tail -n 1 | cut -d= -f2)"
          if [ "$DECLARED_VERSION" != "$VERSION_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match APP_VERSION_NAME=$DECLARED_VERSION"
            exit 1
          fi

      - name: Test
        run: ./gradlew test --no-daemon --console=plain

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Prepare artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/SD302-${VERSION}-debug.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sd302-apk
          path: release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          body: |
            ## SD302 ${{ github.ref_name }}
            - 应用更名为 SD302，UI 全面重设计（Material 3 + Material You 动态取色，参照 KernelSU 风格）
            - 新增一键备份/还原功能
            - 实时日志记录与崩溃捕获
            - 修复点"停止"闪退问题
