name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The release notes are built from the commits between the previous
          # tag and this one, which needs the full history.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android command line tools, so the
      # build uses them directly instead of depending on a third-party setup
      # action. Every value is echoed, so a failure here names the cause.
      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            for candidate in /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then SDK_ROOT="$candidate"; break; fi
            done
          fi
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::no Android SDK found on this runner"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "SDK root: $SDK_ROOT"
          ls "$SDK_ROOT"

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          sdkmanager --list_installed

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          DECLARED_VERSION="$(grep '^APP_VERSION_NAME=' gradle.properties | tail -n 1 | cut -d= -f2)"
          if [ "$DECLARED_VERSION" != "$VERSION_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match APP_VERSION_NAME=$DECLARED_VERSION"
            exit 1
          fi

      - name: Test
        run: ./gradlew test --no-daemon --console=plain

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Prepare artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/SD302-${VERSION}-debug.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: sd302-apk
          path: release/*.apk

      # The notes are built here rather than with the action's
      # generate_release_notes input: that calls a separate GitHub API whose
      # failures are invisible, while git log is reproducible and testable.
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "## SD302 ${GITHUB_REF_NAME}"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since $PREV_TAG:"
              echo
              git log --no-merges --pretty='- %s' "$PREV_TAG..${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='- %s' "${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          cat release-notes.md

      # Updating a release that already exists is the path that kept failing,
      # so a stale release for this tag is cleared first and the action always
      # takes its create path. The delete is explicit, so its result is visible
      # in the log instead of surfacing as an opaque retry exhaustion.
      - name: Remove a stale release for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body="$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")"
          case "$body" in
            *'"message":"Not Found"'*)
              echo "no existing release for ${GITHUB_REF_NAME}"
              exit 0
              ;;
          esac
          release_id="${body#*\"id\":}"
          release_id="${release_id%%,*}"
          release_id="$(echo "$release_id" | tr -d ' ')"
          if [ -z "$release_id" ]; then
            echo "::error::could not read a release id for ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "deleting stale release $release_id"
          curl -sS -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/$release_id"
          echo "deleted"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.apk
          overwrite_files: true
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
